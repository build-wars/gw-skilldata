# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# https://github.com/sebastianbergmann/phpunit/blob/main/.github/workflows/ci.yaml

# https://github.com/actions/checkout
# https://github.com/actions/upload-artifact
# https://github.com/shivammathur/setup-php
# https://github.com/ramsey/composer-install
# https://github.com/codecov/codecov-action
# https://github.com/codacy/codacy-coverage-reporter-action
# https://github.com/JamesIves/github-pages-deploy-action
# https://github.com/stefanzweifel/git-auto-commit-action

on:
  push:
    branches:
      - main
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - main

name: "Continuous Integration"

env:
  PHP_EXTENSIONS: curl, fileinfo, intl, json, mbstring, simplexml, sodium, zlib
  PHP_INI_VALUES: memory_limit=-1, error_reporting=-1, display_errors=On

jobs:

  static-code-analysis:
    name: "Static Code Analysis"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php-version:
          - "8.4"
          - "8.5"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ast, ${{ env.PHP_EXTENSIONS }}
          ini-values: ${{ env.PHP_INI_VALUES }}
          coverage: none

      - name: "Validate composer.json"
        run: composer validate --no-interaction --ansi --strict --verbose --with-dependencies

      - name: "Install dependencies with composer"
        uses: ramsey/composer-install@v4

      - name: "Run PHP_CodeSniffer"
        run: php vendor/bin/phpcs -v

      - name: "Run phan"
        run: php vendor/bin/phan --target-php-version=${{ matrix.php-version }}


  tests:
    name: "Unit Tests (PHP)"
    needs: static-code-analysis
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php-version:
          - "8.4"
          - "8.5"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Install PHP with extensions"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: ${{ env.PHP_INI_VALUES }}
          coverage: pcov
        # https://github.com/shivammathur/setup-php/issues/1096#issuecomment-5026413877
        env:
          fail-fast: true

      - name: "Install dependencies with composer"
        uses: ramsey/composer-install@v4

      - name: "Run tests with phpunit"
        run: php vendor/bin/phpunit --colors=always --configuration=phpunit.xml.dist

      - name: "Send code coverage report to Codecov.io"
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .build/coverage/clover.xml


  build-js:
    name: "Unit Tests (Javascript)"
    runs-on: ubuntu-latest

    steps:
      - name: "checkout sources"
        uses: actions/checkout@v7

      - name: "install dependencies"
        run: npm install

      - name: "run eslint"
        run: npm run lint

      - name: "run mocha tests (with coverage)"
        run: npm run test-with-coverage

      - name: "build"
        run: npm run build

      - name: "build-src"
        run: npm run build-src

      - name: "send code coverage report to codecov.io"
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .build/coverage-js/clover.xml


  build-public:
    needs: build-js
    name: "Publish files"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v7

      - name: "install dependencies"
        run: npm install

      - name: "Install PHP with extensions"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: ${{ env.PHP_INI_VALUES }}
          coverage: none

      - name: "Install dependencies with composer"
        uses: ramsey/composer-install@v4

      - name: "build"
        run: npm run build

      - name: "build-src"
        run: npm run build-src

      - name: "Build JSON and paw-ned² databases"
        run: php ./tools/build-ci.php

      - name: "Copy files"
        run: |
          mkdir ./public/js
          cp ./dist/gw-skilldata-es6.js ./public/js
          cp ./dist/gw-skilldata-es6-src.js ./public/js
          cp ./dist/gw-skilldata-iife.js ./public/js
          cp ./dist/gw-skilldata-iife-src.js ./public/js
          cp ./dist/gw-skilldata-node.cjs ./public/js
          cp ./dist/gw-skilldata-node-src.cjs ./public/js
          cp ./dist/gw-skilldata-umd.js ./public/js
          cp ./dist/gw-skilldata-umd-src.js ./public/js
          mkdir ./public/json
          cp ./data/json-full/*.json ./public/json
          mkdir ./public/json/skills
          cp ./data/json-skills/*.json ./public/json/skills
          mkdir ./public/pawned
          cp ./.build/pawned/*.csv ./public/pawned
          cp ./.build/pawned/*.ini ./public/pawned
          mkdir ./public/schemas
          cp ./data/schemas/*.schema.json ./public/schemas

      # windows: 7z a -r archive.zip ./dir/*
      - name: "Zip release files"
        shell: bash
        run: zip -r buildwars-gw-skilldata.zip ./public

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: gw-skilldata-${{ github.sha }}
          path: ./public

      - name: "Attach file(s) to release"
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            buildwars-gw-skilldata.zip

      - name: "Publish files to gh-pages"
        if: github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: true
